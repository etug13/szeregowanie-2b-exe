name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --onefile --clean --noconfirm --name algorytm algorytm2b.py
      - name: Test EXE (sztuczne instancje, limit n/20)
        run: python scripts/check_exe.py dist/algorytm.exe
      - uses: actions/upload-artifact@v4
        with:
          name: algorytm-windows-x64
          path: dist/algorytm.exe
          if-no-files-found: error
