name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --onefile --clean --noconfirm --name algorytm algorytm2b.py
      - run: python -m PyInstaller --onefile --clean --noconfirm --name weryfikator weryfikator2b.py
      - run: python -m PyInstaller --onefile --clean --noconfirm --name czas czas2b.py
      - name: Test algorytm.exe (sztuczne instancje, limit n/20)
        run: python scripts/check_exe.py dist/algorytm.exe
      - name: Zloz paczke i przetestuj ja tak, jak na labie (cmd)
        shell: cmd
        run: |
          copy dist\algorytm.exe lab\algorytm.exe || exit /b 1
          copy dist\weryfikator.exe lab\weryfikator.exe || exit /b 1
          copy dist\czas.exe lab\czas.exe || exit /b 1
          python scripts/check_exe.py --make lab/moje-instancje || exit /b 1
          copy lab\algorytm.exe lab\programy\999999.exe || exit /b 1
          cd lab
          weryfikator.exe --autotest || exit /b 1
          echo.| call TESTUJ.cmd
          findstr /c:"CZAS" /c:"B" wyniki\999999\CZASY.txt wyniki\999999\KRYTERIUM.txt && exit /b 1
          type wyniki\999999\CZASY.txt
          type wyniki\999999\KRYTERIUM.txt
          czas.exe programy\999999.exe moje-instancje\in_test_50.txt w.txt 2.5 || exit /b 1
          weryfikator.exe moje-instancje\in_test_50.txt w.txt || exit /b 1
      - name: Wyczysc dane testowe
        shell: cmd
        run: |
          rmdir /s /q lab\wyniki
          del lab\moje-instancje\in_test_*.txt lab\programy\999999.exe lab\w.txt
      - uses: actions/upload-artifact@v4
        with:
          name: laboratorium-2b
          path: lab
          if-no-files-found: error
