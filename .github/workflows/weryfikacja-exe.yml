name: Weryfikacja wydanego EXE
on:
  push:
    branches: [weryfikacja-exe]
permissions:
  contents: read
jobs:
  release-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SHA: ea1519c1f52d9f4fda90c2e7a0056f0e632bb9a334404895044bc9b44b34d405
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz algorytm.exe z wydania i sprawdz SHA-256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory exe | Out-Null
          Invoke-WebRequest https://github.com/etug13/szeregowanie-2b-exe/releases/download/v1-2026-11-19/algorytm.exe -OutFile exe\159876.exe
          $h = (Get-FileHash exe\159876.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $h"
          if ($h -ne $env:SHA) { throw "Inny plik niz wyslany uzytkownikowi" }
      - name: Test EXE (sztuczne instancje, limit n/20)
        run: python scripts/check_exe.py exe/159876.exe
      - name: Pelna paczka START na 10 instancjach n=50..500 (nazwa 159876.exe)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item lab\programy\*.exe -ErrorAction SilentlyContinue
          Copy-Item exe\159876.exe lab\programy\159876.exe
          python scripts/check_exe.py --make lab/moje-instancje
          & .\lab\START.ps1 -BezPauzy
          $csv = Get-ChildItem "$env:GITHUB_WORKSPACE\lab\wyniki" -Recurse -Filter DO-ARKUSZA.csv | Select-Object -First 1
          $rows = @(Import-Csv $csv.FullName -Delimiter ';')
          $rows | Format-Table -AutoSize
          if ($rows.Count -ne 10) { throw "Oczekiwano 10 wierszy, jest $($rows.Count)" }
          $bad = @($rows | Where-Object { $_.komentarz -ne 'OK' })
          if ($bad.Count -gt 0) { throw "Bledy w raporcie: $($bad | ConvertTo-Json -Compress)" }
