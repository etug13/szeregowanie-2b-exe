name: Weryfikacja wydanego EXE
on:
  push:
    branches: [weryfikacja-exe]
permissions:
  contents: read
jobs:
  release-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SHA: ea1519c1f52d9f4fda90c2e7a0056f0e632bb9a334404895044bc9b44b34d405
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz algorytm.exe z wydania i sprawdz SHA-256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory exe | Out-Null
          Invoke-WebRequest https://github.com/etug13/szeregowanie-2b-exe/releases/download/v1-2026-11-19/algorytm.exe -OutFile exe\159876.exe
          $h = (Get-FileHash exe\159876.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $h"
          if ($h -ne $env:SHA) { throw "Inny plik niz wyslany uzytkownikowi" }
      - name: Test EXE (sztuczne instancje, limit n/20)
        run: python scripts/check_exe.py exe/159876.exe
      - name: Pelna paczka START na 10 instancjach n=50..500 (nazwa 159876.exe)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item lab\programy\*.exe -ErrorAction SilentlyContinue
          Copy-Item exe\159876.exe lab\programy\159876.exe
          python scripts/check_exe.py --make lab/moje-instancje
          & .\lab\START.ps1 -BezPauzy
          $csv = Get-ChildItem "$env:GITHUB_WORKSPACE\lab\wyniki" -Recurse -Filter DO-ARKUSZA.csv | Select-Object -First 1
          $rows = @(Import-Csv $csv.FullName -Delimiter ';')
          $rows | Format-Table -AutoSize
          if ($rows.Count -ne 10) { throw "Oczekiwano 10 wierszy, jest $($rows.Count)" }
          $bad = @($rows | Where-Object { $_.komentarz -ne 'OK' })
          if ($bad.Count -gt 0) { throw "Bledy w raporcie: $($bad | ConvertTo-Json -Compress)" }
      - name: Tryb wybiorczy i bez ucinania (wolny.exe = sen 1.4 x limit + algorytm)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'using System; using System.Diagnostics; using System.Threading; using System.Globalization;
          public static class W { public static int Main(string[] a) {
            double lim = double.Parse(a[2], CultureInfo.InvariantCulture);
            Thread.Sleep((int)(lim * 1400));
            var p = Process.Start(new ProcessStartInfo(@"' + "$env:GITHUB_WORKSPACE\exe\159876.exe" + '", "\"" + a[0] + "\" \"" + a[1] + "\" 0.5") { UseShellExecute = false });
            p.WaitForExit(); return p.ExitCode; } }'
          Add-Type -TypeDefinition $src -OutputType ConsoleApplication -OutputAssembly lab\programy\wolny.exe
          function Last { $d = Get-ChildItem lab\wyniki -Directory | Sort-Object Name | Select-Object -Last 1
            Get-ChildItem $d.FullName -Recurse -Filter DO-ARKUSZA.csv | ForEach-Object { $p = $_.Directory.Name; Import-Csv $_.FullName -Delimiter ';' | Select-Object @{n='program';e={$p}},* } }
          # 1) wybiorczo: jeden program po numerze, dwie instancje
          & .\lab\START.ps1 -BezPauzy -Programy 1 -Rozmiary 50,100
          $r = @(Last); $r | Format-Table -AutoSize
          if ($r.Count -ne 2 -or @($r | Where-Object { $_.program -ne '159876' -or $_.komentarz -ne 'OK' }).Count) { throw 'wybiorczy: zly raport' }
          # 2) ucinanie: wolny.exe zabity
          & .\lab\START.ps1 -BezPauzy -Programy wolny.exe -Rozmiary 50
          $r = @(Last); $r | Format-Table -AutoSize
          if ($r.Count -ne 1 -or $r[0].czas -notlike 'CZAS =*' -or $r[0].kryterium -match '^\d+$') { throw 'ucinanie: zly raport' }
          # 3) bez ucinania: prawdziwy czas > limit, wynik zweryfikowany
          & .\lab\START.ps1 -BezPauzy -BezUcinania -Programy wolny -Rozmiary 50,100
          $r = @(Last); $r | Format-Table -AutoSize
          foreach ($x in $r) {
            $t = [double]($x.czas -replace '^CZAS =','')
            if ($x.czas -notlike 'CZAS =*' -or $t -lt 3.4 -or $x.kryterium -notmatch '^\d+$' -or $x.komentarz -ne 'CZAS; wynik poprawny') { throw "bez ucinania: zly raport $($x | ConvertTo-Json -Compress)" }
          }
          if ($r.Count -ne 2) { throw 'bez ucinania: oczekiwano 2 wierszy' }
